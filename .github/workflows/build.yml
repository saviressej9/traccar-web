name: Build Project

on:
  push:
    branches: [ master, family-ui ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      # Build verification for family-ui
