name: Run Lint

on:
  push:
    branches:
      - master
      - family-ui
  pull_request:
    branches:
      - master

jobs:
  lint:
    name: Check Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
