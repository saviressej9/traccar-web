server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build output must 404 when it is missing. Falling through to
    # index.html hands the browser an HTML page with a .js content type, and a
    # client holding a stale index.html then fails to parse it rather than
    # getting a clean error it can recover from.
    #
    # The filename changes whenever the contents do, so these are safe to keep
    # forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else must revalidate. Without an explicit policy clients apply
    # heuristic caching and can hold a stale index.html for days, which leaves
    # them asking for chunks that no longer exist. "no-cache" still allows a
    # cheap 304 via the ETag; it is not the same as refusing to cache.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://192.168.2.42:8082;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
