<?xml version="1.0" encoding="UTF-8"?>
<!--
  Family map marker on a full-bleed indigo tile.

  The generator bakes an opaque background into every icon, so a white-bordered
  mark on white just loses its border. Filling the tile with the theme indigo
  and cutting the marker out in white keeps the shape readable at 16px on a
  dark browser tab and as a home screen icon.

  The glyph stays well inside the canvas so maskable icons can crop without
  clipping it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#1a237e"/>
  <g fill="#ffffff">
    <path d="M32 50 L23.5 37 L40.5 37 Z"/>
    <circle cx="32" cy="27" r="13.5"/>
  </g>
  <circle cx="32" cy="27" r="5.5" fill="#1a237e"/>
</svg>
